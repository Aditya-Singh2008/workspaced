[package]
name = "workspace-app"
version = "0.1.0"
description = "Standalone desktop digital workspace for viewing and arranging local files"
authors = ["Workspace App"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "workspace_app_lib"
# Desktop only. The scaffold also emitted `staticlib` (iOS) and `cdylib`
# (Android); both are removed because mobile is explicitly out of scope
# (AGENTS.md, "Platform targets").
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` backs `FileHandle.streamUrl()`: it lets the webview load a
# real path directly in an <img>/<video> src instead of pulling whole files
# through JS memory. Scope is set in tauri.conf.json.
tauri = { version = "2", features = ["protocol-asset"] }
# Real filesystem access for viewer plugins and the persistence layer (AGENTS.md: Persistence).
tauri-plugin-fs = "2"
# Session/layout persistence store (AGENTS.md: Persistence).
tauri-plugin-store = "2"
# Native file-open dialogs returning real paths (AGENTS.md: native file dialogs).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
